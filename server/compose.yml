name: event-fabric-billing

# CPU and memory limits, so that a run measures the services and not the laptop: with
# Postgres, RabbitMQ and the load generator capped well above one replica, adding replicas
# should add throughput until one of them saturates. Defaults sum to 12 CPUs and 10 GB with
# 3 replicas and the load generator. Keep the sum below what Docker Desktop is given
# (Settings → Resources), and stop other projects' containers before a measured run, since
# their usage is not capped. Limits are quotas, not pinned cores.

x-app: &app
  build:
    context: .
    # EventFabric is built from the sibling checkout.
    additional_contexts:
      event-fabric: ../../event-fabric
  image: event-fabric-billing:dev
  environment:
    DATABASE_URL: postgres://billing:billing@postgres:5432/billing
    SETTINGS_DATABASE_URL: postgres://settings:settings@settings-postgres:5432/billing_settings
    AMQP_URL: amqp://billing:billing@rabbitmq:5672
    PORT: "3000"
    # Containers must listen on every interface; the host port stays bound to 127.0.0.1.
    HOST: 0.0.0.0
    # Read-only Event log routes for the web client's debugging tools; local only.
    DEVTOOLS: "1"
    # `debug` adds EventFabric's 10 s summaries: Consumer group stages and lag, Outbox, Readmodel reads, pools.
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    # The registry check makes registering a Customer this slow (see `services/registry.ts`).
    REGISTRY_DELAY_MS: "${REGISTRY_DELAY_MS:-1500}"
    # Partitions of the `billing` Readmodel group and the `accounts` and `receipts` Sagas.
    PARTITIONS: "${PARTITIONS:-1}"
    # Event store connections per replica: its Outbox deliveries, Consumer groups and
    # Commands share them. With pg's default of 10 a Saga next to the Outbox
    # dispatcher falls behind. Keep replicas × (this + 10 for Readmodels) under 100.
    PG_POOL_MAX: "${PG_POOL_MAX:-20}"
    # `mongo` keeps the `billing` Readmodel group in Mongo; the Event log stays in Postgres.
    BILLING_STORE: "${BILLING_STORE:-postgres}"
    MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
  deploy:
    resources:
      limits: &app-limits
        cpus: "${APP_CPUS:-1}"
        memory: ${APP_MEMORY:-1g}

services:
  # Ordinary settings own a database and table, initialized only on an empty volume.
  settings-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: settings
      POSTGRES_PASSWORD: settings
      POSTGRES_DB: billing_settings
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - settings-postgres:/var/lib/postgresql
      - ./database/settings.sql:/docker-entrypoint-initdb.d/settings.sql:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U settings -d billing_settings"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    # shared_buffers is a quarter of the memory limit; pg_stat_statements for query costs.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_CACHE_SIZE:-3GB}
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 1g
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-4}"
          memory: ${POSTGRES_MEMORY:-4g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A one-member replica set: the Mongo Readmodel store needs transactions. The health
  # check initiates it on first start and reports healthy once it is the primary.
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:57017:27017"]
    volumes: [mongo:/data/db]
    deploy:
      resources:
        limits:
          cpus: "${MONGO_CPUS:-2}"
          memory: ${MONGO_MEMORY:-2g}
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 10s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: billing
      RABBITMQ_DEFAULT_PASS: billing
      # Keep the frequent diagnostic CLI inside the broker's CPU quota.
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1 +A 1"
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    # RabbitMQ sizes its memory alarm from this limit and blocks publishers when it is hit.
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPUS:-2}"
          memory: ${RABBITMQ_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 30

  # Framework tables are migrated explicitly, never on startup.
  migrate:
    <<: *app
    command: ["node_modules/event-fabric/dist/cli/main.js", "migrate", "--config", "dist/event-fabric.config.js"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Three identical replicas, each running every role. Leases keep one active instance
  # per Readmodel group and Saga; RabbitMQ keeps one active handler per Command Partition.
  app:
    <<: *app
    deploy:
      replicas: ${REPLICAS:-3}
      resources:
        limits: *app-limits
    # A replica that subscribes while another one still creates the same quorum queue
    # is refused (`noproc`) and exits; the restart finds the queue ready.
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      settings-postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The only way in: round-robin over the replicas.
  lb:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${API_PORT:-3300}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    depends_on:
      app: { condition: service_healthy }

  smoke:
    <<: *app
    profiles: [smoke]
    entrypoint: ["node", "dist/smoke.js"]
    command: []
    environment:
      API_URL: http://lb
    depends_on:
      lb: { condition: service_started }

  # A third-party provider importing history, chained on returned ids (`src/scenario.ts`).
  scenario:
    <<: *app
    profiles: [scenario]
    entrypoint: ["node", "dist/scenario.js"]
    command: []
    environment:
      API_URL: http://lb
      CUSTOMERS: ${CUSTOMERS:-20}
    depends_on:
      lb: { condition: service_started }

  # Throughput: clients looping register → issue → 2 payments (`src/load.ts`).
  load:
    <<: *app
    profiles: [load]
    deploy:
      resources:
        limits:
          cpus: "${LOAD_CPUS:-2}"
          memory: 1g
    entrypoint: ["node", "dist/load.js"]
    command: []
    environment:
      API_URL: http://lb
      CONCURRENCY: ${CONCURRENCY:-50}
      DURATION_S: ${DURATION_S:-30}
    depends_on:
      lb: { condition: service_started }

  # Bulk import: Customers with Invoices and payments, kept between runs (`src/import.ts`).
  import:
    <<: *app
    profiles: [load]
    deploy:
      resources:
        limits:
          cpus: "${LOAD_CPUS:-2}"
          memory: 1g
    entrypoint: ["node", "dist/import.js"]
    command: []
    environment:
      API_URL: http://lb
      CUSTOMERS: ${CUSTOMERS:-2000}
      INVOICES: ${INVOICES:-5}
      CONCURRENCY: ${CONCURRENCY:-50}
    depends_on:
      lb: { condition: service_started }

volumes:
  postgres:
  mongo:
  settings-postgres:
