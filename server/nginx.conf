# Round-robin over every `app` replica. Docker's DNS returns one address per replica.
upstream billing {
    server app:3000 max_fails=0;
    keepalive 64;
    # Retire cached sockets before Node's advertised 5s keep-alive timeout.
    keepalive_timeout 4s;
}
server {
    listen 80;
    location / {
        proxy_pass http://billing;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Server-Sent Events: pass each frame through as it is written.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # A replica that drops the connection is retried on the next one, for reads only.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
